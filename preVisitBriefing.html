<body>
<div class="briefing" dir="rtl">
  <div class="briefing__body">
    <p>הלקוח ביצע הזמנה אחרונה ב-15/10, ויש להתייחס לניקוד מהביקור הקודם במגוון של מים מוגזים.</p>
    <p>יש לבדוק את סטטוס הטיפול בקריאה הפתוחה על המקרר התקול ולבחון את תגובת הסניף לטעמים השונים של מותג נורדיק.</p>
    <p>המשימה המרכזית בביקור היא לקדם ולסגור את הכנסת קוקה קולה לתפריט העסקית.</p>
  </div>
  <button id="tts" class="briefing__tts" type="button" aria-label="הקרא" title="הקרא"><span class="sap-icon" aria-hidden="true">&#xe228;</span></button>
</div>
<script>
(function () {
  var INTRO = "לקראת הביקור באגאדיר פתח תקווה.";
  var TEXT = "הלקוח ביצע הזמנה אחרונה ב-15 לאוקטובר, ויש להתייחס לניקוד מהביקור הקודם במגוון של מים מוגזים. יש לבדוק את סטטוס הטיפול בקריאה הפתוחה על המקרר התקול ולבחון את תגובת הסניף לטעמים השונים של מותג נורדיק. המשימה המרכזית בביקור היא לקדם ולסגור את הכנסת קוקה קולה לתפריט העסקית.";
  var ICON_PLAY = "\ue228", ICON_STOP = "\ue205";
  var btn = document.getElementById("tts"), icon = btn.querySelector(".sap-icon");
  var speaking = false, runId = 0, audio = null;

  function parts() { return [INTRO].concat(TEXT.split(/(?<=\.)\s+/)); }

  function setState(on) {
    speaking = on;
    btn.classList.toggle("is-on", on);
    icon.textContent = on ? ICON_STOP : ICON_PLAY;
    var l = on ? "עצור הקראה" : "הקרא";
    btn.setAttribute("aria-label", l); btn.title = l;
  }

  function pickVoice() {
    if (!window.speechSynthesis) return null;
    var he = speechSynthesis.getVoices().filter(function (v) { return /^he|^iw/i.test(v.lang); });
    var fem = he.filter(function (v) { return !/avri|asaf|male|man\b/i.test(v.name) || /female|woman/i.test(v.name); });
    return fem.find(function (v) { return /natural|online|neural/i.test(v.name); })
      || fem.find(function (v) { return /hila|carmit|female|woman/i.test(v.name); })
      || fem[0] || he[0] || null;
  }

  function stopAll() {
    runId++;
    if (audio) { audio.pause(); audio = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
  }

  function speakLocal(list) {
    var s = window.speechSynthesis;
    if (!s) { setState(false); return; }
    s.cancel();
    var voice = pickVoice();
    list.forEach(function (t, i) {
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "he-IL"; if (voice) u.voice = voice; u.rate = 1.15; u.pitch = 1;
      if (i === list.length - 1) u.onend = u.onerror = function () { setState(false); };
      s.speak(u);
    });
  }

  function playOnline(list, i, id) {
    if (id !== runId) return;
    if (i >= list.length) { setState(false); return; }
    var a = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&tl=iw&client=tw-ob&ttsspeed=1&q=" + encodeURIComponent(list[i]));
    a.playbackRate = 1.25; a.preservesPitch = true;
    audio = a;
    var fallback = function () { if (id === runId) speakLocal(list.slice(i)); };
    a.onended = function () { setTimeout(function () { playOnline(list, i + 1, id); }, 120); };
    a.onerror = fallback;
    a.play().catch(fallback);
  }

  if (window.speechSynthesis) speechSynthesis.getVoices();

  btn.addEventListener("click", function () {
    if (speaking) { stopAll(); setState(false); return; }
    stopAll(); setState(true);
    var v = pickVoice();
    if (v && /hila|carmit|female|woman/i.test(v.name)) speakLocal(parts());
    else playOnline(parts(), 0, runId);
  });

  window.addEventListener("pagehide", stopAll);
})();
</script>
</body>
</html>
